name: DeepSeek preflight and native-harness SWE benchmark

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Original five-product campaign, or enhanced six-product calibration/formal campaign
        type: choice
        default: connection
        options: [connection, calibration, formal, enhanced-calibration, enhanced-formal, enhanced-reproduce, enhanced-lock, enhanced-observed, enhanced-memory, enhanced-idle-memory, enhanced-suite]

      product:
        description: Product for the independent observed batch
        type: choice
        default: openclaw57_patched
        options: [openclaw57_patched, openclaw, dsh, hermes, codex, claude]

      observed_task_timeout_seconds:
        description: Formal solve limit for the independent observed batch (seconds)
        type: choice
        default: '600'
        options: ['600', '1800']

      runtime_run_id:
        description: Optional prior expanded campaign whose identical encrypted runtime can be reused
        type: string
        default: ''

      suite_products:
        description: JSON array of expanded-suite products; use a subset only for explicit recovery
        type: string
        default: '["openclaw57_patched","codex","dsh","claude","hermes","openclaw"]'

permissions:
  contents: read
  actions: read

jobs:
  expanded-suite:
    if: inputs.mode == 'enhanced-suite'
    uses: ./.github/workflows/swe-expanded.yml
    with:
      runtime_run_id: ${{ inputs.runtime_run_id }}
      suite_products: ${{ inputs.suite_products }}
    secrets: inherit

  connection:
    if: inputs.mode == 'connection'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify secret and requested model without generating tokens
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python3 evaluation/tools/provider_connection.py --output "$RUNNER_TEMP/deepseek-connection.json"
      - name: Retain connection metadata only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deepseek-connection-metadata
          path: ${{ runner.temp }}/deepseek-connection.json
          retention-days: 3
          if-no-files-found: error
  five-harness:
    if: inputs.mode != 'connection' && inputs.mode != 'enhanced-observed' && inputs.mode != 'enhanced-memory' && inputs.mode != 'enhanced-idle-memory' && inputs.mode != 'enhanced-suite'
    runs-on: ubuntu-24.04
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate measurement controls without model calls
        run: python3 -m unittest discover -s benchmarks/swe_single/tests -v
      - name: Install the controller's compressed-log reader
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends zstd
      - name: Prepare a gold-free immutable task build context
        env:
          BENCH_MODE: ${{ inputs.mode }}
          OPENCLAW57_PATCH_KEY: ${{ secrets.OPENCLAW57_PATCH_KEY }}
        run: |
          if [[ "$BENCH_MODE" == enhanced-reproduce || "$BENCH_MODE" == enhanced-lock ]]; then
            python3 benchmarks/swe_single/prepare_enhanced.py --diagnose-sdk --output "$RUNNER_TEMP/swe-preparation"
          elif [[ "$BENCH_MODE" == enhanced-* ]]; then
            python3 benchmarks/swe_single/prepare_enhanced.py --output "$RUNNER_TEMP/swe-preparation"
          else
            python3 benchmarks/swe_single/prepare.py --output "$RUNNER_TEMP/swe-preparation"
          fi
      - name: Set up the pinned runtime for sixth-product lock resolution
        if: inputs.mode == 'enhanced-lock'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - name: Resolve only the delivered SDK and freeze sixth-product dependencies
        if: inputs.mode == 'enhanced-lock'
        env:
          OPENCLAW57_PATCH_KEY: ${{ secrets.OPENCLAW57_PATCH_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/swe-evidence"
          cp "$RUNNER_TEMP/swe-preparation/preparation.json" "$RUNNER_TEMP/swe-evidence/preparation.json"
          npm install --global --no-audit --no-fund pnpm@10.33.2
          cd "$RUNNER_TEMP/swe-preparation/context/enhanced-source"
          pnpm --filter openclaw --filter @openclaw/agentloop update @zte/agentloop-sdk --lockfile-only --ignore-scripts > "$RUNNER_TEMP/swe-build.log" 2>&1
          cd "$GITHUB_WORKSPACE"
          python3 -c 'import sys; sys.path.insert(0, "benchmarks/swe_single"); from sealed_input import transform; transform(sys.argv[1], sys.argv[2])' \
            "$RUNNER_TEMP/swe-preparation/context/enhanced-source/pnpm-lock.yaml" "$RUNNER_TEMP/swe-evidence/pnpm-lock.yaml.enc"
      - name: Build one common pinned runtime for every selected native CLI
        if: inputs.mode != 'enhanced-lock'
        run: |
          mkdir -p "$RUNNER_TEMP/swe-evidence"
          cp "$RUNNER_TEMP/swe-preparation/preparation.json" "$RUNNER_TEMP/swe-evidence/preparation.json"
          docker build --progress=plain -t five-harness-swe "$RUNNER_TEMP/swe-preparation/context" > "$RUNNER_TEMP/swe-build.log" 2>&1
          docker image inspect five-harness-swe > "$RUNNER_TEMP/swe-evidence/built-image.json"
      - name: Run hidden-test controls, native tool and usage calibration, then selected campaign
        if: inputs.mode != 'enhanced-reproduce' && inputs.mode != 'enhanced-lock'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BENCH_MODE: ${{ inputs.mode }}
        run: |
          if [[ "$BENCH_MODE" == enhanced-* ]]; then
            PROTOCOL=benchmarks/swe_single/protocol-six.json
            MODE="${BENCH_MODE#enhanced-}"
          else
            PROTOCOL=benchmarks/swe_single/protocol.json
            MODE="$BENCH_MODE"
          fi
          sudo --preserve-env=DEEPSEEK_API_KEY,GITHUB_SHA,GITHUB_RUN_ID python3 benchmarks/swe_single/run.py \
            --image five-harness-swe --output "$RUNNER_TEMP/swe-evidence/campaign" \
            --protocol "$PROTOCOL" --mode "$MODE" --deadline-seconds 14400
      - name: Retain build diagnostics with source details sealed for enhanced inputs
        if: always()
        env:
          BENCH_MODE: ${{ inputs.mode }}
          OPENCLAW57_PATCH_KEY: ${{ secrets.OPENCLAW57_PATCH_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/swe-evidence"
          if [[ -f "$RUNNER_TEMP/swe-build.log" ]]; then
            if [[ "$BENCH_MODE" == enhanced-* ]]; then
              python3 -c 'import sys; sys.path.insert(0, "benchmarks/swe_single"); from sealed_input import transform; transform(sys.argv[1], sys.argv[2])' \
                "$RUNNER_TEMP/swe-build.log" "$RUNNER_TEMP/swe-evidence/build.log.enc"
            else
              cp "$RUNNER_TEMP/swe-build.log" "$RUNNER_TEMP/swe-evidence/build.log"
            fi
          fi
      - name: Check retained artifacts for the real provider credential
        id: audit
        if: always()
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: sudo --preserve-env=DEEPSEEK_API_KEY python3 benchmarks/swe_single/audit_artifacts.py "$RUNNER_TEMP/swe-evidence"
      - name: Upload raw evidence and every run result
        if: always() && steps.audit.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: five-harness-swe-${{ inputs.mode }}-${{ github.run_id }}
          path: ${{ runner.temp }}/swe-evidence/
          retention-days: 14
          compression-level: 3
          if-no-files-found: error

  observed:
    if: inputs.mode == 'enhanced-observed'
    name: Observed ${{ inputs.product }} — controls, calibration, three repeats
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      OBSERVED_PRODUCT: ${{ inputs.product }}
      OBSERVED_TASK_TIMEOUT_SECONDS: ${{ inputs.observed_task_timeout_seconds }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate measurement and observed-stage admission
        run: python3 -m unittest discover -s benchmarks/swe_single/tests -v
      - name: Install compressed-log reader
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends zstd
      - name: Prepare the same sealed patched source and frozen task
        env:
          OPENCLAW57_PATCH_KEY: ${{ secrets.OPENCLAW57_PATCH_KEY }}
        run: python3 benchmarks/swe_single/prepare_enhanced.py --output "$RUNNER_TEMP/swe-preparation"
      - name: Build the same pinned common runtime
        run: |
          mkdir -p "$RUNNER_TEMP/swe-evidence"
          cp "$RUNNER_TEMP/swe-preparation/preparation.json" "$RUNNER_TEMP/swe-evidence/preparation.json"
          docker build --progress=plain -t five-harness-swe "$RUNNER_TEMP/swe-preparation/context" > "$RUNNER_TEMP/swe-build.log" 2>&1
          docker image inspect five-harness-swe > "$RUNNER_TEMP/swe-evidence/built-image.json"
      - name: Seal build diagnostics
        if: always()
        env:
          OPENCLAW57_PATCH_KEY: ${{ secrets.OPENCLAW57_PATCH_KEY }}
        run: |
          if [[ -f "$RUNNER_TEMP/swe-build.log" ]]; then
            mkdir -p "$RUNNER_TEMP/swe-evidence"
            python3 -c 'import sys; sys.path.insert(0, "benchmarks/swe_single"); from sealed_input import transform; transform(sys.argv[1], sys.argv[2])' \
              "$RUNNER_TEMP/swe-build.log" "$RUNNER_TEMP/swe-evidence/build.log.enc"
          fi
      - name: Hidden-test environment controls (no model calls)
        id: controls
        timeout-minutes: 20
        run: |
          sudo --preserve-env=DEEPSEEK_API_KEY,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_STEP_SUMMARY python3 benchmarks/swe_single/observed.py \
            --image five-harness-swe --product "$OBSERVED_PRODUCT" --task-timeout-seconds "$OBSERVED_TASK_TIMEOUT_SECONDS" --stage controls \
            --output "$RUNNER_TEMP/swe-evidence/observed"
      - name: Audit controls evidence
        id: audit_controls
        if: always() && steps.controls.outcome != 'skipped'
        run: sudo --preserve-env=DEEPSEEK_API_KEY python3 benchmarks/swe_single/audit_artifacts.py "$RUNNER_TEMP/swe-evidence/observed/segments/controls"
      - name: Retain controls raw traces immediately
        if: always() && steps.audit_controls.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: observed-${{ inputs.product }}-${{ github.run_id }}-controls
          path: ${{ runner.temp }}/swe-evidence/observed/segments/controls/
          retention-days: 14
          compression-level: 3
          if-no-files-found: error
      - name: Native tool and usage calibration
        id: calibration
        timeout-minutes: 20
        run: |
          sudo --preserve-env=DEEPSEEK_API_KEY,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_STEP_SUMMARY python3 benchmarks/swe_single/observed.py \
            --image five-harness-swe --product "$OBSERVED_PRODUCT" --task-timeout-seconds "$OBSERVED_TASK_TIMEOUT_SECONDS" --stage calibration \
            --output "$RUNNER_TEMP/swe-evidence/observed"
      - name: Audit calibration evidence
        id: audit_calibration
        if: always() && steps.calibration.outcome != 'skipped'
        run: sudo --preserve-env=DEEPSEEK_API_KEY python3 benchmarks/swe_single/audit_artifacts.py "$RUNNER_TEMP/swe-evidence/observed/segments/calibration"
      - name: Retain calibration raw traces immediately
        if: always() && steps.audit_calibration.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: observed-${{ inputs.product }}-${{ github.run_id }}-calibration
          path: ${{ runner.temp }}/swe-evidence/observed/segments/calibration/
          retention-days: 14
          compression-level: 3
          if-no-files-found: error
      - name: Formal repeat 1 of 3
        id: block_1
        timeout-minutes: 40
        run: |
          sudo --preserve-env=DEEPSEEK_API_KEY,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_STEP_SUMMARY python3 benchmarks/swe_single/observed.py \
            --image five-harness-swe --product "$OBSERVED_PRODUCT" --task-timeout-seconds "$OBSERVED_TASK_TIMEOUT_SECONDS" --stage block-1 \
            --output "$RUNNER_TEMP/swe-evidence/observed"
      - name: Audit block-1 evidence
        id: audit_block_1
        if: always() && steps.block_1.outcome != 'skipped'
        run: sudo --preserve-env=DEEPSEEK_API_KEY python3 benchmarks/swe_single/audit_artifacts.py "$RUNNER_TEMP/swe-evidence/observed/segments/block-1"
      - name: Retain block-1 raw traces immediately
        if: always() && steps.audit_block_1.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: observed-${{ inputs.product }}-${{ github.run_id }}-block-1
          path: ${{ runner.temp }}/swe-evidence/observed/segments/block-1/
          retention-days: 14
          compression-level: 3
          if-no-files-found: error
      - name: Formal repeat 2 of 3
        id: block_2
        timeout-minutes: 40
        run: |
          sudo --preserve-env=DEEPSEEK_API_KEY,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_STEP_SUMMARY python3 benchmarks/swe_single/observed.py \
            --image five-harness-swe --product "$OBSERVED_PRODUCT" --task-timeout-seconds "$OBSERVED_TASK_TIMEOUT_SECONDS" --stage block-2 \
            --output "$RUNNER_TEMP/swe-evidence/observed"
      - name: Audit block-2 evidence
        id: audit_block_2
        if: always() && steps.block_2.outcome != 'skipped'
        run: sudo --preserve-env=DEEPSEEK_API_KEY python3 benchmarks/swe_single/audit_artifacts.py "$RUNNER_TEMP/swe-evidence/observed/segments/block-2"
      - name: Retain block-2 raw traces immediately
        if: always() && steps.audit_block_2.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: observed-${{ inputs.product }}-${{ github.run_id }}-block-2
          path: ${{ runner.temp }}/swe-evidence/observed/segments/block-2/
          retention-days: 14
          compression-level: 3
          if-no-files-found: error
      - name: Formal repeat 3 of 3
        id: block_3
        timeout-minutes: 40
        run: |
          sudo --preserve-env=DEEPSEEK_API_KEY,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_STEP_SUMMARY python3 benchmarks/swe_single/observed.py \
            --image five-harness-swe --product "$OBSERVED_PRODUCT" --task-timeout-seconds "$OBSERVED_TASK_TIMEOUT_SECONDS" --stage block-3 \
            --output "$RUNNER_TEMP/swe-evidence/observed"
      - name: Audit block-3 evidence
        id: audit_block_3
        if: always() && steps.block_3.outcome != 'skipped'
        run: sudo --preserve-env=DEEPSEEK_API_KEY python3 benchmarks/swe_single/audit_artifacts.py "$RUNNER_TEMP/swe-evidence/observed/segments/block-3"
      - name: Retain block-3 raw traces immediately
        if: always() && steps.audit_block_3.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: observed-${{ inputs.product }}-${{ github.run_id }}-block-3
          path: ${{ runner.temp }}/swe-evidence/observed/segments/block-3/
          retention-days: 14
          compression-level: 3
          if-no-files-found: error
      - name: Audit all retained evidence
        id: audit_all
        if: always()
        run: sudo --preserve-env=DEEPSEEK_API_KEY python3 benchmarks/swe_single/audit_artifacts.py "$RUNNER_TEMP/swe-evidence"
      - name: Retain combined results and build provenance
        if: always() && steps.audit_all.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: observed-${{ inputs.product }}-${{ github.run_id }}-combined
          path: ${{ runner.temp }}/swe-evidence/
          retention-days: 14
          compression-level: 3
          if-no-files-found: error

  memory:
    if: inputs.mode == 'enhanced-memory'
    name: Six native process-tree RSS and PSS observations (no inference)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate measurement and observed-stage admission
        run: python3 -m unittest discover -s benchmarks/swe_single/tests -v
      - name: Install compressed-log reader
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends zstd
      - name: Prepare the same sealed patched source and frozen task
        env:
          OPENCLAW57_PATCH_KEY: ${{ secrets.OPENCLAW57_PATCH_KEY }}
        run: python3 benchmarks/swe_single/prepare_enhanced.py --output "$RUNNER_TEMP/swe-preparation"
      - name: Build the same pinned common runtime
        run: |
          mkdir -p "$RUNNER_TEMP/swe-evidence"
          cp "$RUNNER_TEMP/swe-preparation/preparation.json" "$RUNNER_TEMP/swe-evidence/preparation.json"
          docker build --progress=plain -t five-harness-swe "$RUNNER_TEMP/swe-preparation/context" > "$RUNNER_TEMP/swe-build.log" 2>&1
          docker image inspect five-harness-swe > "$RUNNER_TEMP/swe-evidence/built-image.json"
      - name: Seal build diagnostics
        if: always()
        env:
          OPENCLAW57_PATCH_KEY: ${{ secrets.OPENCLAW57_PATCH_KEY }}
        run: |
          if [[ -f "$RUNNER_TEMP/swe-build.log" ]]; then
            mkdir -p "$RUNNER_TEMP/swe-evidence"
            python3 -c 'import sys; sys.path.insert(0, "benchmarks/swe_single"); from sealed_input import transform; transform(sys.argv[1], sys.argv[2])' \
              "$RUNNER_TEMP/swe-build.log" "$RUNNER_TEMP/swe-evidence/build.log.enc"
          fi
      - name: Measure DSH ready RSS and PSS (three fresh repeats)
        id: memory_dsh
        continue-on-error: true
        timeout-minutes: 10
        run: |
          sudo --preserve-env=GITHUB_SHA,GITHUB_RUN_ID python3 benchmarks/swe_single/memory_probe.py \
            --image five-harness-swe --product dsh --output "$RUNNER_TEMP/swe-evidence/memory"
      - name: Audit DSH memory evidence
        id: audit_memory_dsh
        if: always() && steps.memory_dsh.outcome != 'skipped'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: sudo --preserve-env=DEEPSEEK_API_KEY python3 benchmarks/swe_single/audit_artifacts.py "$RUNNER_TEMP/swe-evidence/memory/dsh"
      - name: Retain DSH memory observations immediately
        if: always() && steps.audit_memory_dsh.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-dsh-${{ github.run_id }}
          path: ${{ runner.temp }}/swe-evidence/memory/dsh/
          retention-days: 14
          compression-level: 3
          if-no-files-found: error
      - name: Measure Patched OpenClaw 5.7 ready RSS and PSS (three fresh repeats)
        id: memory_openclaw57_patched
        continue-on-error: true
        timeout-minutes: 10
        run: |
          sudo --preserve-env=GITHUB_SHA,GITHUB_RUN_ID python3 benchmarks/swe_single/memory_probe.py \
            --image five-harness-swe --product openclaw57_patched --output "$RUNNER_TEMP/swe-evidence/memory"
      - name: Audit Patched OpenClaw 5.7 memory evidence
        id: audit_memory_openclaw57_patched
        if: always() && steps.memory_openclaw57_patched.outcome != 'skipped'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: sudo --preserve-env=DEEPSEEK_API_KEY python3 benchmarks/swe_single/audit_artifacts.py "$RUNNER_TEMP/swe-evidence/memory/openclaw57_patched"
      - name: Retain Patched OpenClaw 5.7 memory observations immediately
        if: always() && steps.audit_memory_openclaw57_patched.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-openclaw57_patched-${{ github.run_id }}
          path: ${{ runner.temp }}/swe-evidence/memory/openclaw57_patched/
          retention-days: 14
          compression-level: 3
          if-no-files-found: error
      - name: Measure Hermes ready RSS and PSS (three fresh repeats)
        id: memory_hermes
        continue-on-error: true
        timeout-minutes: 10
        run: |
          sudo --preserve-env=GITHUB_SHA,GITHUB_RUN_ID python3 benchmarks/swe_single/memory_probe.py \
            --image five-harness-swe --product hermes --output "$RUNNER_TEMP/swe-evidence/memory"
      - name: Audit Hermes memory evidence
        id: audit_memory_hermes
        if: always() && steps.memory_hermes.outcome != 'skipped'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: sudo --preserve-env=DEEPSEEK_API_KEY python3 benchmarks/swe_single/audit_artifacts.py "$RUNNER_TEMP/swe-evidence/memory/hermes"
      - name: Retain Hermes memory observations immediately
        if: always() && steps.audit_memory_hermes.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-hermes-${{ github.run_id }}
          path: ${{ runner.temp }}/swe-evidence/memory/hermes/
          retention-days: 14
          compression-level: 3
          if-no-files-found: error
      - name: Measure Codex ready RSS and PSS (three fresh repeats)
        id: memory_codex
        continue-on-error: true
        timeout-minutes: 10
        run: |
          sudo --preserve-env=GITHUB_SHA,GITHUB_RUN_ID python3 benchmarks/swe_single/memory_probe.py \
            --image five-harness-swe --product codex --output "$RUNNER_TEMP/swe-evidence/memory"
      - name: Audit Codex memory evidence
        id: audit_memory_codex
        if: always() && steps.memory_codex.outcome != 'skipped'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: sudo --preserve-env=DEEPSEEK_API_KEY python3 benchmarks/swe_single/audit_artifacts.py "$RUNNER_TEMP/swe-evidence/memory/codex"
      - name: Retain Codex memory observations immediately
        if: always() && steps.audit_memory_codex.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-codex-${{ github.run_id }}
          path: ${{ runner.temp }}/swe-evidence/memory/codex/
          retention-days: 14
          compression-level: 3
          if-no-files-found: error
      - name: Measure Claude Code ready RSS and PSS (three fresh repeats)
        id: memory_claude
        continue-on-error: true
        timeout-minutes: 10
        run: |
          sudo --preserve-env=GITHUB_SHA,GITHUB_RUN_ID python3 benchmarks/swe_single/memory_probe.py \
            --image five-harness-swe --product claude --output "$RUNNER_TEMP/swe-evidence/memory"
      - name: Audit Claude Code memory evidence
        id: audit_memory_claude
        if: always() && steps.memory_claude.outcome != 'skipped'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: sudo --preserve-env=DEEPSEEK_API_KEY python3 benchmarks/swe_single/audit_artifacts.py "$RUNNER_TEMP/swe-evidence/memory/claude"
      - name: Retain Claude Code memory observations immediately
        if: always() && steps.audit_memory_claude.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-claude-${{ github.run_id }}
          path: ${{ runner.temp }}/swe-evidence/memory/claude/
          retention-days: 14
          compression-level: 3
          if-no-files-found: error
      - name: Measure OpenClaw 11.3 ready RSS and PSS (three fresh repeats)
        id: memory_openclaw
        continue-on-error: true
        timeout-minutes: 10
        run: |
          sudo --preserve-env=GITHUB_SHA,GITHUB_RUN_ID python3 benchmarks/swe_single/memory_probe.py \
            --image five-harness-swe --product openclaw --output "$RUNNER_TEMP/swe-evidence/memory"
      - name: Audit OpenClaw 11.3 memory evidence
        id: audit_memory_openclaw
        if: always() && steps.memory_openclaw.outcome != 'skipped'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: sudo --preserve-env=DEEPSEEK_API_KEY python3 benchmarks/swe_single/audit_artifacts.py "$RUNNER_TEMP/swe-evidence/memory/openclaw"
      - name: Retain OpenClaw 11.3 memory observations immediately
        if: always() && steps.audit_memory_openclaw.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-openclaw-${{ github.run_id }}
          path: ${{ runner.temp }}/swe-evidence/memory/openclaw/
          retention-days: 14
          compression-level: 3
          if-no-files-found: error
      - name: Require complete process-tree observations for all six products
        if: always()
        run: sudo python3 benchmarks/swe_single/memory_probe.py --output "$RUNNER_TEMP/swe-evidence/memory" --summarize
      - name: Audit combined memory evidence
        id: audit_memory_all
        if: always()
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: sudo --preserve-env=DEEPSEEK_API_KEY python3 benchmarks/swe_single/audit_artifacts.py "$RUNNER_TEMP/swe-evidence"
      - name: Retain combined memory observations and build provenance
        if: always() && steps.audit_memory_all.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-combined-${{ github.run_id }}
          path: ${{ runner.temp }}/swe-evidence/
          retention-days: 14
          compression-level: 3
          if-no-files-found: error

  idle-memory:
    if: inputs.mode == 'enhanced-idle-memory'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate memory measurement and runtime admission
        run: python3 -m unittest discover -s benchmarks/swe_single/tests -v
      - name: Prepare the sealed source and unchanged dependency locks
        env:
          OPENCLAW57_PATCH_KEY: ${{ secrets.OPENCLAW57_PATCH_KEY }}
        run: python3 benchmarks/swe_single/prepare_enhanced.py --output "$RUNNER_TEMP/swe-preparation"
      - name: Build the same pinned common runtime
        run: |
          mkdir -p "$RUNNER_TEMP/idle-evidence"
          cp "$RUNNER_TEMP/swe-preparation/preparation.json" "$RUNNER_TEMP/idle-evidence/preparation.json"
          docker build --progress=plain -t five-harness-swe "$RUNNER_TEMP/swe-preparation/context" > "$RUNNER_TEMP/idle-build.log" 2>&1
          docker image inspect five-harness-swe > "$RUNNER_TEMP/idle-evidence/built-image.json"
      - name: Measure three fresh idle AgentLoop Gateways without model credentials
        timeout-minutes: 20
        run: |
          sudo --preserve-env=GITHUB_SHA,GITHUB_RUN_ID python3 benchmarks/swe_single/idle_memory.py \
            --image five-harness-swe --output "$RUNNER_TEMP/idle-evidence/idle-agentloop"
      - name: Seal source build diagnostics
        if: always()
        env:
          OPENCLAW57_PATCH_KEY: ${{ secrets.OPENCLAW57_PATCH_KEY }}
        run: |
          if [[ -f "$RUNNER_TEMP/idle-build.log" ]]; then
            mkdir -p "$RUNNER_TEMP/idle-evidence"
            python3 -c 'import sys; sys.path.insert(0, "benchmarks/swe_single"); from sealed_input import transform; transform(sys.argv[1], sys.argv[2])' \
              "$RUNNER_TEMP/idle-build.log" "$RUNNER_TEMP/idle-evidence/build.log.enc"
          fi
      - name: Audit the idle evidence
        id: audit_idle
        if: always()
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: sudo --preserve-env=DEEPSEEK_API_KEY python3 benchmarks/swe_single/audit_artifacts.py "$RUNNER_TEMP/idle-evidence"
      - name: Retain idle process memory, initialization logs, and provenance
        if: always() && steps.audit_idle.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openclaw57-idle-agentloop-${{ github.run_id }}
          path: ${{ runner.temp }}/idle-evidence/
          retention-days: 14
          compression-level: 3
          if-no-files-found: error
