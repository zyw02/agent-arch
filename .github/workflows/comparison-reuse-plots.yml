name: Plot accepted historical reuse metrics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'comparison/export_reuse_metrics.py'
      - 'comparison/export_observability_reuse.py'
      - '.github/workflows/comparison-reuse-plots.yml'
permissions:
  contents: read
jobs:
  plot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install plotting dependency on disposable worker
        run: python3 -m pip install --no-cache-dir --target "$RUNNER_TEMP/reuse-plot-deps" matplotlib==3.10.7
      - name: Recompute real usage and render paired observations
        env:
          PYTHONPATH: ${{ runner.temp }}/reuse-plot-deps
        run: python3 comparison/export_reuse_metrics.py --output "$RUNNER_TEMP/reuse-plots" --plot
      - name: Extract exact accepted telemetry fault counters and render observations
        env:
          PYTHONPATH: ${{ runner.temp }}/reuse-plot-deps
        run: python3 comparison/export_observability_reuse.py --output "$RUNNER_TEMP/reuse-plots" --plot
      - name: Retain chart and source rows
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: historical-guide-reuse-plots
          path: ${{ runner.temp }}/reuse-plots/
          retention-days: 30
          if-no-files-found: error
      - name: Remove task-owned plotting dependencies
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/reuse-plot-deps"
