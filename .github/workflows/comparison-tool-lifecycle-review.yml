name: Blind native-only tool failure and retry reconstruction
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-tool-lifecycle-record-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Freeze randomized native HD packets and separate answer key
        run: python3 comparison/prepare_tool_lifecycle_review.py --report comparison/evidence/tool-lifecycle-20261028/formal-original-report.json.gz --output "$RUNNER_TEMP/native-hd-review-dataset"
      - name: Request one isolated automated reconstruction per native packet
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python3 comparison/review_platform_native.py review --protocol comparison/tool-lifecycle-native-review-protocol.json --packets "$RUNNER_TEMP/native-hd-review-dataset/packets" --output "$RUNNER_TEMP/native-hd-review-answers"
      - name: Score frozen answers after isolated review finishes
        run: python3 comparison/review_platform_native.py score --protocol comparison/tool-lifecycle-native-review-protocol.json --dataset "$RUNNER_TEMP/native-hd-review-dataset" --reviews "$RUNNER_TEMP/native-hd-review-answers" --output "$RUNNER_TEMP/native-hd-review-dataset/score.json"
      - name: Retain native-only prompts, original answers, hashes, usage and scores
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-tool-lifecycle-record-review
          path: |
            ${{ runner.temp }}/native-hd-review-dataset/
            ${{ runner.temp }}/native-hd-review-answers/
          if-no-files-found: error
          retention-days: 30
