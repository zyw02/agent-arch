name: DSH and OpenClaw native read calibration
on:
  workflow_dispatch:
    inputs:
      live_model:
        description: Run one real DeepSeek read pilot per product/route after synthetic calibration
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'comparison/native_read_probe.py'
      - 'comparison/read_mcp_fixture.py'
      - 'comparison/resource_collector.py'
      - 'comparison/resource_launcher.py'
      - 'comparison/resource_memory_reader.py'
      - '.github/workflows/comparison-native-read.yml'
permissions:
  contents: read
jobs:
  calibrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Install explicit comparison versions on disposable worker
        env:
          npm_config_cache: ${{ runner.temp }}/native-read-cache
        run: |
          npm install --prefix "$RUNNER_TEMP/native-read-runtime" --save-exact --no-audit --no-fund @deepseek-ai/dsh@0.2.2-alpha.2 openclaw@2026.10.8
          mkdir -p "$RUNNER_TEMP/native-read-evidence"
          cp "$RUNNER_TEMP/native-read-runtime/package-lock.json" "$RUNNER_TEMP/native-read-evidence/"
          node --version > "$RUNNER_TEMP/native-read-evidence/node-version.txt"
      - name: Delegate task-owned resource collection subtree
        run: |
          task_group="/sys/fs/cgroup/agent-arch-${GITHUB_RUN_ID}"
          sudo mkdir "$task_group"
          echo '+cpu +memory +pids +io' | sudo tee "$task_group/cgroup.subtree_control" > /dev/null
          sudo chown "$(id -u):$(id -g)" "$task_group" "$task_group/cgroup.procs" "$task_group/cgroup.subtree_control"
          echo "AGENT_ARCH_CGROUP_ROOT=$task_group" >> "$GITHUB_ENV"
      - name: Exercise real native tools with synthetic model responses
        env:
          LIVE_MODEL: ${{ inputs.live_model || 'false' }}
          DEEPSEEK_API_KEY: ${{ inputs.live_model && secrets.DEEPSEEK_API_KEY || '' }}
        run: |
          if [ "$LIVE_MODEL" = true ]; then
            python3 comparison/native_read_probe.py --runtime "$RUNNER_TEMP/native-read-runtime" --output "$RUNNER_TEMP/native-read-evidence" --live-model
          else
            python3 comparison/native_read_probe.py --runtime "$RUNNER_TEMP/native-read-runtime" --output "$RUNNER_TEMP/native-read-evidence"
          fi
      - name: Retain compact adapter calibration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-read-calibration
          path: ${{ runner.temp }}/native-read-evidence/
          retention-days: 30
          if-no-files-found: error
      - name: Remove task-owned installation and cache
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/native-read-runtime" "$RUNNER_TEMP/native-read-cache"
          if [ -d "/sys/fs/cgroup/agent-arch-${GITHUB_RUN_ID}" ]; then
            sudo rmdir "/sys/fs/cgroup/agent-arch-${GITHUB_RUN_ID}"
          fi
