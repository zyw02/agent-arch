name: Calibrate native platform server APIs
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-platform-api
  cancel-in-progress: false
jobs:
  calibrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Install pinned native server products on the disposable worker
        env:
          npm_config_cache: ${{ runner.temp }}/platform-api-cache
        run: |
          npm install --prefix "$RUNNER_TEMP/platform-api-runtime" --save-exact --no-audit --no-fund @deepseek-ai/dsh@0.2.2-alpha.2 openclaw@2026.10.8
          mkdir -p "$RUNNER_TEMP/platform-api-evidence"
          cp "$RUNNER_TEMP/platform-api-runtime/package-lock.json" "$RUNNER_TEMP/platform-api-evidence/"
          node --version > "$RUNNER_TEMP/platform-api-evidence/node-version.txt"
          cat /etc/os-release > "$RUNNER_TEMP/platform-api-evidence/os-release.txt"
      - name: Delegate only this job's collection subtree
        run: |
          task_group="/sys/fs/cgroup/agent-arch-${GITHUB_RUN_ID}"
          sudo mkdir "$task_group"
          echo '+cpu +memory +pids +io' | sudo tee "$task_group/cgroup.subtree_control" > /dev/null
          sudo chown "$(id -u):$(id -g)" "$task_group" "$task_group/cgroup.procs" "$task_group/cgroup.subtree_control"
          echo "AGENT_ARCH_CGROUP_ROOT=$task_group" >> "$GITHUB_ENV"
      - name: Verify two public native sessions per server and collect lifecycle resources
        run: python3 comparison/platform_api_probe.py --runtime "$RUNNER_TEMP/platform-api-runtime" --output "$RUNNER_TEMP/platform-api-evidence"
      - name: Retain original API, process and resource observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-platform-api-calibration
          path: ${{ runner.temp }}/platform-api-evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Remove this job's native installation and collection subtree
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/platform-api-runtime" "$RUNNER_TEMP/platform-api-cache"
          if [ -d "/sys/fs/cgroup/agent-arch-${GITHUB_RUN_ID}" ]; then
            sudo rmdir "/sys/fs/cgroup/agent-arch-${GITHUB_RUN_ID}"
          fi
